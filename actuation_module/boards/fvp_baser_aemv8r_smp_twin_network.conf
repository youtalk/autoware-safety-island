# Network configuration for a digital twin on a virtual network, such as a
# Corellium project network. The address, the netmask and the DDS peer come
# from build.sh --twin-ip and --twin-peer. Discovery uses the static peer
# only, as on the point-to-point X5H link.
CONFIG_NET_DHCPV4=n
CONFIG_DDS_DISABLE_MULTICAST=y
