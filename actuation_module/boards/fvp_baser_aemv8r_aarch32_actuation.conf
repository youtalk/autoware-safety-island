# The 32-bit FVP BaseR (Cortex-R52), such as the Corellium aem8r, with a
# LAN9220-family NIC. CONFIG_DDS_NETWORK_INTERFACE stays empty here: with
# --network twin, build.sh selects the interface by its static address.

# Control command output mode
CONFIG_CONTROL_CMD_OUTPUT_DDS_ONLY=y

CONFIG_ETH_SMSC911X=y
